openapi: 3.0.0

info:
  title: Enterprise Transport API
  version: 2.0.0

servers:
  - url: /api

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

paths:

  /auth/register:
    post:
      tags: [Auth]
      summary: Register user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - fullName
                - email
                - password
              properties:
                fullName:
                  type: string
                  example: Rajit Chakraborty
                email:
                  type: string
                  example: rajit@example.com
                password:
                  type: string
                  example: StrongPassword123
                role:
                  type: string
                  example: CUSTOMER
      responses:
        201:
          description: User registered successfully

  /auth/login:
    post:
      tags: [Auth]
      summary: Login user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  example: rajit@example.com
                password:
                  type: string
                  example: StrongPassword123
      responses:
        200:
          description: Login successful

  /auth/refresh:
    post:
      tags: [Auth]
      summary: Refresh JWT token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - refreshToken
              properties:
                refreshToken:
                  type: string
                  example: jwt_refresh_token_here
      responses:
        200:
          description: Token refreshed

  /auth/forgot-password:
    post:
      tags: [Auth]
      summary: Send password reset link
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
              properties:
                email:
                  type: string
                  example: rajit@example.com
      responses:
        200:
          description: Reset link generated

  /auth/reset-password:
    post:
      tags: [Auth]
      summary: Reset password using token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - token
                - newPassword
              properties:
                token:
                  type: string
                  example: reset_token_here
                newPassword:
                  type: string
                  example: NewStrongPassword123
      responses:
        200:
          description: Password reset successful

  /auth/logout:
    post:
      tags: [Auth]
      summary: Logout user
      security:
        - bearerAuth: []
      responses:
        200:
          description: Logged out successfully

  /routes:
    get:
      tags: [Routes]
      summary: List routes
      responses:
        200:
          description: Routes list

    post:
      tags: [Routes]
      summary: Create route
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - source
                - destination
                - base_price
                - distance_km
              properties:
                source:
                  type: string
                  example: Kolkata
                destination:
                  type: string
                  example: Delhi
                base_price:
                  type: number
                  example: 1500
                distance_km:
                  type: number
                  example: 1500
      responses:
        201:
          description: Route created
