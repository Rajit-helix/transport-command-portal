services:
  - type: web
    name: projectcodex-app
    runtime: node
    rootDir: backend
    buildCommand: npm install && npm --prefix ../frontend install && npm run build:frontend
    startCommand: npm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      - key: DATABASE_URL
        fromDatabase:
          name: projectcodex-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 15m
      - key: REFRESH_TOKEN_EXPIRES_IN
        value: 7d
      - key: CORS_ORIGINS
        sync: false
      - key: LOG_LEVEL
        value: info

databases:
  - name: projectcodex-db
