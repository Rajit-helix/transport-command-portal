name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["*"]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: transport_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5434:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d transport_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6381:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    defaults:
      run:
        working-directory: backend

    env:
      NODE_ENV: test
      PORT: 4001
      DATABASE_URL: postgres://postgres:postgres@localhost:5434/transport_test
      JWT_SECRET: test_secret
      JWT_EXPIRES_IN: 15m
      REFRESH_TOKEN_EXPIRES_IN: 7d
      CORS_ORIGINS: http://localhost:5173
      REDIS_URL: redis://localhost:6381
      RATE_LIMIT_WINDOW_MS: 60000
      RATE_LIMIT_MAX_AUTH: 100
      RATE_LIMIT_MAX_BOOKING: 100
      LOG_LEVEL: warn

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Install backend deps
        run: npm ci

      - name: Wait for Postgres and Redis readiness
        run: |
          node -e "const { Client } = require('pg'); const Redis = require('ioredis'); const sleep = (ms) => new Promise((r) => setTimeout(r, ms)); async function waitPg() { for (let i = 0; i < 60; i++) { const c = new Client({ connectionString: process.env.DATABASE_URL }); try { await c.connect(); await c.query('SELECT 1'); await c.end(); console.log('Postgres ready'); return; } catch (e) { try { await c.end(); } catch {} await sleep(1000); } } throw new Error('Postgres not ready in time'); } async function waitRedis() { for (let i = 0; i < 60; i++) { const r = new Redis(process.env.REDIS_URL, { lazyConnect: true, maxRetriesPerRequest: 1 }); try { await r.connect(); const pong = await r.ping(); await r.quit(); if (pong === 'PONG') { console.log('Redis ready'); return; } } catch (e) { try { r.disconnect(); } catch {} await sleep(1000); } } throw new Error('Redis not ready in time'); } (async () => { await waitPg(); await waitRedis(); })().catch((e) => { console.error(e.message); process.exit(1); });"

      - name: Run migrations
        run: npm run migrate:up

      - name: Seed DB
        run: npm run seed

      - name: Lint backend
        run: npm run lint

      - name: Test backend with coverage
        run: npm test -- --detectOpenHandles --forceExit

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend deps
        run: npm ci

      - name: Lint frontend
        run: npm run lint

      - name: Build frontend
        run: npm run build

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: docker build -t transport-backend:ci ./backend
      - name: Build frontend image
        run: docker build -t transport-frontend:ci ./frontend
