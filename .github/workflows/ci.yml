name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["*"]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: transport_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5434:5432
      redis:
        image: redis:7-alpine
        ports:
          - 6381:6379

    defaults:
      run:
        working-directory: backend

    env:
      NODE_ENV: test
      PORT: 4001
      DATABASE_URL: postgres://postgres:postgres@localhost:5434/transport_test
      JWT_SECRET: test_secret
      JWT_EXPIRES_IN: 15m
      REFRESH_TOKEN_EXPIRES_IN: 7d
      CORS_ORIGINS: http://localhost:5173
      REDIS_URL: redis://localhost:6381
      RATE_LIMIT_WINDOW_MS: 60000
      RATE_LIMIT_MAX_AUTH: 100
      RATE_LIMIT_MAX_BOOKING: 100
      LOG_LEVEL: warn

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Install backend deps
        run: npm install

      - name: Run migrations
        run: npm run migrate:up

      - name: Seed DB
        run: npm run seed

      - name: Lint backend
        run: npm run lint

      - name: Test backend with coverage
        run: npm test

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend deps
        run: npm install

      - name: Lint frontend
        run: npm run lint

      - name: Build frontend
        run: npm run build

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: docker build -t transport-backend:ci ./backend
      - name: Build frontend image
        run: docker build -t transport-frontend:ci ./frontend
